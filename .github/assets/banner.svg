<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="garbaj: a disk garbage collector for machines that run coding agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111c2e"/>
    </linearGradient>
    <linearGradient id="acc" gradientUnits="userSpaceOnUse" x1="150" y1="80" x2="264" y2="224">
      <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#84cc16"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <radialGradient id="glow" cx="22%" cy="50%" r="45%">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".20"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .lid { transform-origin: 232px 104px; animation: lid 5s ease-in-out infinite; }
    @keyframes lid { 0%,55%,100% { transform: rotate(0) } 65%,85% { transform: rotate(-16deg) translateY(-6px) } }
    .chip { animation: drop 5s ease-in infinite; opacity: 0 }
    .c2 { animation-delay: .25s } .c3 { animation-delay: .5s }
    @keyframes drop { 0%,60% { opacity:0; transform: translateY(-46px) } 66% { opacity:1 } 84% { opacity:1; transform: translateY(26px) } 88%,100% { opacity:0; transform: translateY(26px) } }
    @media (prefers-reduced-motion: reduce) { .lid,.chip { animation: none } }
  </style>
  <rect width="960" height="300" rx="20" fill="url(#bg)"/>
  <rect width="960" height="300" rx="20" fill="url(#grid)"/>
  <rect width="960" height="300" rx="20" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="959" height="299" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- falling worktrees -->
  <g fill="none" stroke="url(#acc)" stroke-width="3" stroke-linecap="round">
    <g class="chip"><circle cx="186" cy="86" r="5"/><path d="M186 91v10"/></g>
    <g class="chip c2"><rect x="198" y="74" width="12" height="12" rx="3"/></g>
    <g class="chip c3"><circle cx="228" cy="84" r="5"/><path d="M228 89v8"/></g>
  </g>
  <!-- bin -->
  <g fill="none" stroke="url(#acc)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <g class="lid"><path d="M150 104h114"/><path d="M190 104v-12a6 6 0 0 1 6-6h22a6 6 0 0 1 6 6v12"/></g>
    <path d="M162 122l9 92a10 10 0 0 0 10 9h52a10 10 0 0 0 10-9l9-92z" fill="#0b1220"/>
  </g>
  <!-- git branch inside the bin -->
  <g fill="none" stroke="#e2e8f0" stroke-width="4.5" stroke-linecap="round">
    <path d="M194 152v44"/><path d="M220 158c0 16-26 12-26 28"/>
    <circle cx="194" cy="146" r="6" fill="#0b1220"/><circle cx="194" cy="202" r="6" fill="#0b1220"/><circle cx="220" cy="152" r="6" fill="#0b1220"/>
  </g>

  <text x="318" y="152" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="92" font-weight="700" fill="#f8fafc" letter-spacing="-3">garbaj</text>
  <text x="322" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" fill="#94a3b8">A disk garbage collector for machines that run coding agents.</text>
  <g font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14">
    <rect x="322" y="220" width="156" height="30" rx="15" fill="#5eead4" fill-opacity=".1" stroke="#5eead4" stroke-opacity=".35"/>
    <text x="400" y="240" text-anchor="middle" fill="#5eead4">safe by default</text>
    <rect x="490" y="220" width="170" height="30" rx="15" fill="#84cc16" fill-opacity=".1" stroke="#84cc16" stroke-opacity=".35"/>
    <text x="575" y="240" text-anchor="middle" fill="#a3e635">zero dependencies</text>
    <rect x="672" y="220" width="206" height="30" rx="15" fill="#e2e8f0" fill-opacity=".06" stroke="#e2e8f0" stroke-opacity=".25"/>
    <text x="775" y="240" text-anchor="middle" fill="#cbd5e1">only when disk is low</text>
  </g>
</svg>
